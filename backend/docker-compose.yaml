services:
    postgres:
        image: postgres:15
        restart: always
        volumes:
            - ./postgres:/var/lib/postgresql/data
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres
    # redis:
    #     image: redis:7-alpine
    #     restart: always
    #     ports:
    #         - '6379:6379'
    #     volumes:
    #         - ./redis:/data
    app:
        build: .
        command: npm run start:dev
        volumes:
            - .:/app
            - /app/node_modules
        ports:
            - '3001:3001'
        env_file:
            - .env
        environment:
            DB_HOST: postgres
            # REDIS_HOST: redis
        depends_on:
            - postgres
            # - redis
